name: R6 Sentinel Micro Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  micro:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
      COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
      R6_EXPECTED_STATIONS: '418'
      R6_MAX_RETRIES: '3'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install builder
        run: pip install -e .
      - name: Sentinel-2 micro probe
        run: python -m funghi_r6.sentinel_micro_probe
      - name: Upload micro probe artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r6382a-sentinel-micro-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
