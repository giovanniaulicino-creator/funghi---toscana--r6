name: R6 Copernicus Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
      COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
      COPERNICUS_VEG_WORKERS: '2'
      COPERNICUS_VEG_MIN_INTERVAL_S: '0.75'
      COPERNICUS_VEG_WINDOW_DAYS: '16'
      R6_EXPECTED_STATIONS: '418'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install builder
        run: pip install -e .
      - name: Copernicus read-only probe
        run: python -m funghi_r6.copernicus_probe --out out
      - name: Upload Copernicus probe artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r6381-copernicus-probe-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
