# R6381-COPERNICUS-FIX-2026-10-04
# R638-BACKEND-COPERNICUS-LONGHYDRO-2026-10-03
name: R6 Data Builder

# R641-D1-BUDGET: bootstrap is manual only; pushes never rebuild D1 automatically.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap = primo backfill; full = mattino; light = infragiornaliero"
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, full, light]
  schedule:
    - cron: '5 6 * * *'
      timezone: 'Europe/Rome'
    - cron: '5 12 * * *'
      timezone: 'Europe/Rome'
    - cron: '5 18 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: read

concurrency:
  group: funghi-toscana-r6-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
      COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
      COPERNICUS_VEG_WORKERS: '2'
      COPERNICUS_VEG_MIN_INTERVAL_S: '0.75'
      COPERNICUS_VEG_WINDOW_DAYS: '16'
      R6_EXPECTED_STATIONS: '418'
      R6_BATCH_SIZE: '12'
      R6_BATCH_PAUSE_S: '1.5'
      R6_MAX_RETRIES: '5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install builder
        run: pip install -e .

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "5 6 * * *" ]]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=light" >> "$GITHUB_OUTPUT"
          fi

      - name: Check scheduled D1 readiness
        id: readiness
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] && \
             { [[ -z "$CF_ACCOUNT_ID" ]] || [[ -z "$CF_D1_DATABASE_ID" ]] || [[ -z "$CF_API_TOKEN" ]]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=R6 D1 non configurato::Run schedulato saltato senza errore. Bootstrap manuale resta disponibile."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build scientific snapshot
        if: steps.readiness.outputs.run == 'true'
        run: python -m funghi_r6.cli --mode "${{ steps.mode.outputs.value }}" --out out

      - name: Upload R6 audit artifacts
        if: always() && steps.readiness.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: r6-${{ steps.mode.outputs.value }}-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
