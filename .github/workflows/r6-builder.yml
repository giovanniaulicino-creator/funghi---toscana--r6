name: R6 Data Builder
# R641-D1-BUDGET: bootstrap is manual only; pushes never rebuild D1 automatically.
run-name: R6 daily ${{ inputs.target_day || 'Rome today' }} · ${{ inputs.request_id || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = giornaliero; bootstrap/light = manutenzione manuale"
        required: true
        default: full
        type: choice
        options: [full, bootstrap, light]
      target_day:
        description: "Giornata Europe/Rome YYYY-MM-DD (vuoto = oggi)"
        default: ''
        type: string
      request_id:
        description: "Identificativo dell'innesco esterno (diagnostica)"
        default: ''
        type: string
      force_rebuild:
        description: "Manutenzione: ricostruisci anche se oggi è già completo"
        default: false
        type: boolean
  # Fallback only. Cloudflare checks every ten minutes from 01:15 Rome.
  # Retries after a complete ACTIVE read metadata and do not download sources.
  schedule:
    - cron: '17 1,3,6,9 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: read

# Every writer, automatic or manual, is serialized across this repository.
concurrency:
  group: funghi-toscana-r6-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
      COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
      COPERNICUS_VEG_WORKERS: '2'
      COPERNICUS_VEG_MIN_INTERVAL_S: '0.75'
      COPERNICUS_VEG_WINDOW_DAYS: '16'
      R6_EXPECTED_STATIONS: '418'
      R6_BATCH_SIZE: '12'
      R6_BATCH_PAUSE_S: '1.5'
      R6_MAX_RETRIES: '5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install builder
        run: pip install -e .
      - name: Check production configuration
        shell: bash
        run: |
          if [[ -z "$CF_ACCOUNT_ID" || -z "$CF_D1_DATABASE_ID" || -z "$CF_API_TOKEN" ]]; then
            echo '::error::R6 D1 non configurato: nessuna pubblicazione eseguita.'
            exit 1
          fi
          if [[ "$CF_D1_DATABASE_ID" != 'b198c62b-1165-4626-9bd9-40f10c6ff432' ]]; then
            echo '::error::Database diverso dal D1 Toscana R6: esecuzione bloccata.'
            exit 1
          fi
      - name: Build or reuse today's scientific snapshot
        shell: bash
        env:
          BUILDER_MODE: ${{ inputs.mode || 'full' }}
          BUILDER_TARGET_DAY: ${{ inputs.target_day || '' }}
          BUILDER_REQUEST_ID: ${{ inputs.request_id || github.event_name }}
          BUILDER_FORCE: ${{ inputs.force_rebuild && 'true' || 'false' }}
        run: |
          args=(--daily --provider-readiness-guard --mode "$BUILDER_MODE" --out out --request-id "$BUILDER_REQUEST_ID")
          if [[ -n "$BUILDER_TARGET_DAY" ]]; then args+=(--target-day "$BUILDER_TARGET_DAY"); fi
          if [[ "$BUILDER_FORCE" == 'true' ]]; then args+=(--force-rebuild); fi
          python -m funghi_r6.cli "${args[@]}"
      - name: Daily result
        if: always()
        shell: bash
        run: |
          if [[ -f out/daily-receipt.json ]]; then
            cat out/daily-receipt.json >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f out/diagnostics.json ]]; then
            cat out/diagnostics.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload R6 audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r6-daily-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
