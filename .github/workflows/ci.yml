name: R6 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: pytest -q
      - name: Python syntax audit
        run: python -m compileall -q src tests
      - name: Worker JavaScript syntax audit
        run: node --check worker/src/index.js
      - name: Worker contract tests
        run: node worker/test-worker.mjs
